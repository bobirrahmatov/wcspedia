<!-- WCSpedia My workspace — content-only Confluence HTML macro.
Replace all page ID placeholders in the pages map. Upload shared
wcspedia-style.css, wcspedia.js, publication-config.js, wcspedia-logo.png and approved-only wcspedia-published.json to
REPLACE_WITH_WCSPEDIA_PAGE_ID. Keep the full working JSON restricted.
Configure trusted workspaceEndpoint, workflowEndpoint and suggestionEndpoint.
Set the shared publication-config.js working root and eight business-area page IDs.
Native saves require confirmed child-page receipts from the trusted workflow service.
See NATIVE-PUBLICATION.md; placeholders block native writes without changing this interface.
Deploy the governance checks in GOVERNANCE.md on that trusted service; browser checks are not authorization.
Empty endpoints never report live decisions or suggestions as saved.
Configure bookmarksEndpoint and healthEndpoint for personal saves and governed health.
Empty endpoints show unavailable and never fall back to browser-only production records.
Configure metricsEndpoint for shared document view totals; see METRICS.md.
An empty metrics endpoint shows unavailable counts, never fabricated zeroes.
For production charts, replace both charts URLs with same-origin minified
Highcharts/accessibility attachments and set allowCDN:false. Core must load first.
PDF/Word exports load version-pinned local libraries on demand. Upload citi-logo.png.
The WCSpedia landing logo uses brandLogoUrl; see BRANDING.md for the shared attachment.
The configured upload package supplies all library attachment URLs with allowCDN:false.
See EXPORTS.md and exports-confluence-scripts.html for optional script tags.

-->
