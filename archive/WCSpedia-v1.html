  ],
  articles: [
    {
      id: 'securities-backed-lending',
      title: 'Securities-backed lending: an overview',
      summary: 'Understand how a securities-backed facility works, the role of collateral and the key steps from assessment to ongoing monitoring.',
      category: 'credit-lending', type: 'Guide', updated: '2026-10-14', owner: 'Credit Solutions', readTime: 6, views: 1248,
      tags: ['Securities-backed lending', 'Collateral', 'Credit facilities', 'Getting started'],
      sections: [
        { id: 'overview', title: 'What is securities-backed lending?', paragraphs: ['A securities-backed lending facility allows a client to borrow against an eligible investment portfolio pledged as collateral. The facility can provide liquidity while the client retains exposure to the investments, subject to the agreed terms.', 'The credit assessment considers the borrower, the purpose of the facility and the quality of the collateral together. A strong collateral position does not replace an assessment of the borrower’s ability to meet their obligations.'], bullets: [] },
        { id: 'how-it-works', title: 'How the facility works', paragraphs: ['An agreed collateral framework determines which assets can support the facility and how their lending value is calculated. The approved facility limit and the current collateral lending value are different measures; available capacity depends on the applicable terms and existing utilisation.'], bullets: ['Assess the borrowing need and proposed repayment approach.', 'Review the portfolio and confirm which assets are eligible.', 'Document approval, security arrangements and conditions before use.', 'Monitor utilisation, collateral and required actions throughout the life of the facility.'] },
        { id: 'collateral', title: 'Understanding the collateral', paragraphs: ['A portfolio’s market value is the starting point, rather than a promise of borrowing capacity. Eligibility, valuation adjustments, concentration and currency mismatches can all affect the value recognised for lending.', 'Market movements or changes in the portfolio can reduce collateral coverage. A client may then need to provide additional collateral or reduce borrowing, depending on the contractual terms.'], bullets: ['Check the valuation date and the source of prices.', 'Review issuer, asset-class and currency concentrations.', 'Confirm that pledged assets and security records are complete.'] },
        { id: 'monitoring', title: 'What to monitor', paragraphs: ['Ongoing monitoring connects the current exposure to the latest collateral position, contractual requirements and the borrower’s circumstances. Review the status of any exceptions alongside the headline numbers.'], bullets: ['Utilisation and available capacity.', 'Collateral coverage and material portfolio changes.', 'Covenants, upcoming review dates and unresolved actions.', 'Changes to ownership, documentation or the agreed purpose.'] },
        { id: 'next-steps', title: 'Where to go next', paragraphs: ['For a practical sequence of activities, open the lending lifecycle guide. Use the collateral eligibility article to understand the assessment inputs, and the annual credit review article when preparing an existing facility for review.', 'Product availability, permitted purposes and operational requirements depend on the relevant jurisdiction and facility documentation. Confirm those details with the responsible product and credit teams.'], bullets: [] }
      ]
    },
    {
      id: 'lending-lifecycle', title: 'The lending lifecycle, from request to repayment',
      summary: 'A shared view of the stages, handoffs and key records that connect a lending request to the ongoing management of a facility.',
      category: 'credit-lending', type: 'Guide', updated: '2026-10-10', owner: 'Credit Solutions', readTime: 5, views: 842,
      tags: ['Lending lifecycle', 'Onboarding', 'Credit review', 'Handoffs'],
      sections: [
        { id: 'assessment', title: 'Start with a complete request', paragraphs: ['The initial request brings together the client’s purpose, proposed structure, repayment approach and supporting information. Clear ownership at this stage prevents gaps from moving into the approval process.'], bullets: ['Identify the borrower and connected parties.', 'Set out the proposed terms and supporting collateral.', 'Record information gaps and the team responsible for closing them.'] },
        { id: 'activation', title: 'Move from approval to activation', paragraphs: ['An approval records the decision and its conditions. Activation follows when the required documentation, security and operational checks are complete. Keep evidence of the handoff so that operations can see what has been approved and what remains outstanding.'], bullets: ['Reconcile the facility setup to the approval.', 'Check conditions that must be met before the first drawdown.', 'Confirm the servicing team and monitoring responsibilities.'] },
        { id: 'servicing', title: 'Manage the facility over time', paragraphs: ['Once active, a facility moves through monitoring, servicing and periodic review. Changes in terms, collateral or the borrower’s circumstances may require a new assessment. The final stage is repayment and controlled closure of the associated records.'], bullets: ['Track covenants, review dates and client actions.', 'Record amendments and renewals against the current facility.', 'Complete repayment reconciliation before releasing security.'] }
      ]
    },
    {
      id: 'collateral-eligibility', title: 'Collateral eligibility and lending value',
      summary: 'Learn why market value, eligible collateral and recognised lending value are different, and which inputs to check first.',
      category: 'credit-lending', type: 'Reference', updated: '2026-10-08', owner: 'Collateral Management', readTime: 4, views: 985,
      tags: ['Collateral', 'Eligibility', 'Lending value', 'Valuation'],
      sections: [
        { id: 'definitions', title: 'Three values to distinguish', paragraphs: ['Market value reflects the value of the assets at a point in time. Eligible collateral is the subset accepted under the applicable framework. Lending value is the amount recognised after the relevant adjustments and constraints.', 'These measures can change independently. An asset may retain a market price while its eligibility or recognised lending value changes.'], bullets: [] },
        { id: 'inputs', title: 'Inputs to the assessment', paragraphs: ['Eligibility can depend on the asset, the holding structure and the ability to establish and enforce the required security. The relevant product and credit teams determine the applicable assessment.'], bullets: ['Asset type, issuer and market liquidity.', 'Currency, pricing source and valuation date.', 'Portfolio concentration and restrictions.', 'Custody, ownership and security arrangements.'] },
        { id: 'checks', title: 'Before using a collateral figure', paragraphs: ['Check whether the figure refers to the complete portfolio or only the eligible portion. Reconcile the timestamp and currency with the exposure you are comparing it to, then review any adjustments or exclusions.'], bullets: ['Do not treat a historic valuation as a current one.', 'Investigate missing prices or unexpected eligibility changes.', 'Keep the calculation and supporting evidence with the review record.'] }
      ]
    },
    {
      id: 'facility-structures', title: 'Understanding common credit facility structures',
      summary: 'Compare revolving facilities, term facilities and uncommitted arrangements, with the questions to ask when reading a facility record.',
      category: 'credit-lending', type: 'Reference', updated: '2026-10-03', owner: 'Credit Solutions', readTime: 4, views: 574,
      tags: ['Credit facilities', 'Revolving credit', 'Term lending', 'Documentation'],
      sections: [
        { id: 'structures', title: 'Read the structure before the balance', paragraphs: ['The structure describes how a facility can be used, repaid and, where permitted, drawn again. A revolving facility generally supports repeated drawings within its terms. A term facility follows the agreed drawdown and repayment arrangements.', 'Whether an arrangement is committed or uncommitted is a separate question from whether it is revolving or term. The facility documentation governs the lender’s obligations.'], bullets: [] },
        { id: 'terms', title: 'Terms that shape the facility', paragraphs: ['A headline limit only tells part of the story. Currency, maturity, purpose, security and conditions can affect how the facility is used and managed.'], bullets: ['Approved amount and permitted currencies.', 'Availability period, maturity and repayment profile.', 'Purpose restrictions and conditions for drawing.', 'Security, guarantees and covenant requirements.'] },
        { id: 'records', title: 'Connect the documents and the system record', paragraphs: ['The operational record should reflect the current documented position, including effective amendments. If the record and the documents disagree, identify the source of the discrepancy before relying on either in a downstream action.'], bullets: ['Confirm which agreement and amendment are current.', 'Check that effective dates are recorded consistently.', 'Escalate unclear terms to the responsible team.'] }
      ]
    },
    {
      id: 'annual-credit-review', title: 'Preparing an annual credit review',
      summary: 'Bring the borrower, facility, collateral and monitoring record together for a clear and complete credit review.',
      category: 'credit-risk', type: 'Procedure', updated: '2026-10-13', owner: 'Credit Risk', readTime: 7, views: 1106,
      tags: ['Credit review', 'Annual review', 'Collateral', 'Covenants'],
      sections: [
        { id: 'prepare', title: 'Establish the review scope', paragraphs: ['Start with the current borrower and facility structure, including connected exposures and any recent amendments. Confirm the review date, responsible owner and information needed to assess the position.', 'The review should explain what has changed since the previous decision. Carrying forward earlier wording without checking the underlying facts can hide emerging risks.'], bullets: ['Confirm the current approved terms and outstanding exposure.', 'Identify information that is missing or no longer current.', 'Review prior conditions, exceptions and open actions.'] },
        { id: 'assess', title: 'Build the assessment', paragraphs: ['Bring the borrower’s circumstances, repayment approach and collateral position into one narrative. Distinguish observed facts from assumptions and explain material changes rather than listing data without context.'], bullets: ['Describe the financial position and repayment sources.', 'Assess collateral eligibility, valuation and concentration.', 'Review covenant performance and monitoring outcomes.', 'Explain the impact of changes to the facility or its purpose.'] },
        { id: 'complete', title: 'Make the outcome actionable', paragraphs: ['A useful review gives the decision maker a clear recommendation, the evidence supporting it and the actions that follow. After the decision, make sure the operational records and the next review date reflect the approved outcome.'], bullets: ['Record the decision, conditions and responsible owners.', 'Set due dates for each follow-up action.', 'Link the supporting documents to the review record.', 'Confirm the handoff to the teams carrying out the actions.'] }
      ]
    },
    {
      id: 'monitoring-covenants', title: 'Covenant monitoring: evidence, dates and actions',
      summary: 'A practical guide to maintaining a complete covenant record and responding when evidence or compliance status needs attention.',
      category: 'credit-risk', type: 'Guide', updated: '2026-10-12', owner: 'Credit Monitoring', readTime: 5, views: 964,
      tags: ['Covenants', 'Monitoring', 'PAL', 'Evidence'],
      sections: [
        { id: 'record', title: 'Create a clear monitoring record', paragraphs: ['A covenant record connects an obligation in the facility documentation to a practical monitoring activity. It should make the requirement, timing, evidence and responsible team easy to understand.'], bullets: ['Reference the relevant agreement and requirement.', 'Distinguish the reporting period from the evidence due date.', 'Record who provides, reviews and follows up the evidence.'] },
        { id: 'evidence', title: 'Review the evidence', paragraphs: ['Receipt of a document does not by itself establish compliance. Check that the evidence covers the required period, uses the applicable definition and supports the recorded conclusion.', 'When a calculation is needed, retain the inputs and the method alongside the result so another reviewer can follow the assessment.'], bullets: ['Check completeness and the reporting period.', 'Reconcile material inputs to their source.', 'Record the review outcome and any unresolved questions.'] },
        { id: 'actions', title: 'Manage outstanding items', paragraphs: ['Missing evidence, an approaching deadline and a potential breach are different situations. Use the appropriate status and escalation route for each, and keep the next action visible.'], bullets: ['Assign an owner and a realistic next action.', 'Record agreed follow-up dates and relevant communications.', 'Keep the original obligation visible when a waiver or amendment is considered.'] }
      ]
    },
    {
      id: 'collateral-shortfalls', title: 'Responding to a collateral shortfall',
      summary: 'The information to validate, the teams to involve and the records to maintain when collateral coverage requires attention.',
      category: 'credit-risk', type: 'Procedure', updated: '2026-10-07', owner: 'Collateral Management', readTime: 5, views: 731,
      tags: ['Collateral', 'Shortfall', 'Escalation', 'Monitoring'],
      sections: [
        { id: 'validate', title: 'Validate the position', paragraphs: ['Before acting on a shortfall indicator, confirm the exposure, collateral valuation and relevant contractual measure. A stale price, an unmatched transaction or an incorrect currency conversion can distort the apparent position.'], bullets: ['Align exposure and collateral timestamps.', 'Check prices, currency conversion and eligibility changes.', 'Review pending transactions and recent amendments.'] },

        { id: 'facility', title: 'Facility measures', paragraphs: ['The approved limit describes the facility amount under the current approval. Utilisation describes the amount used under the reporting definition. Available capacity reflects what remains usable after the relevant constraints and existing activity are considered.', 'Do not assume that available capacity always equals limit minus utilisation. Collateral conditions, currency treatment or other restrictions may affect the result.'], bullets: [] },

        { id: 'conditions', title: 'Translate the outcome into actions', paragraphs: ['Approved terms and conditions need to be specific enough for the receiving teams to implement. Separate requirements that apply before activation from ongoing obligations and later follow-up actions.'], bullets: ['State the approved amount, structure and relevant dates.', 'Identify conditions, owners and completion evidence.', 'Make exceptions and their treatment visible.'] },
        { id: 'traceability', title: 'Preserve traceability', paragraphs: ['Keep supporting evidence and subsequent amendments connected to the original decision. A reader should be able to understand the effective position without searching through unrelated files or relying on individual memory.'], bullets: ['Link the supporting analysis and documents.', 'Record effective dates for changes.', 'Maintain the history of decisions and completed actions.'] }

    return Number.isFinite(parsed) ? parsed : -Infinity;

  function filterArticles(articles, options) {
    if (!Array.isArray(articles)) throw new TypeError('Articles must be an array.');
    options = options || {};
    var filters = optionsFor(options);
    var saved = new Set((options.savedIds || []).map(String));
    var days = WINDOWS[filters.updated];
    var now = new Date(options.now == null ? Date.now() : options.now);
    if (!Number.isFinite(now.getTime())) throw new TypeError('Invalid search date.');
    var cutoff = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) - days * DAY;
    var phrase = filters.tokens.join(' ');
    var ranked = articles.map(function (article, index) {
      if (filters.categories.length && filters.categories.indexOf(article.category) === -1) return null;
      if (filters.types.length && filters.types.indexOf(article.type) === -1) return null;
      if (days && timestamp(article.updated) < cutoff) return null;
      if (options.savedOnly && !saved.has(String(article.id))) return null;
      var title = fold(article.title);
      var summary = fold(article.summary);
      var tags = (article.tags || []).map(fold).join(' ');
      var sections = (article.sections || []).map(function (section) {
        return [section.title].concat(section.paragraphs || [], section.bullets || []).map(fold).join(' ');
      }).join(' ');
      var searchable = [title, summary, tags, sections].join(' ');
      if (!filters.tokens.every(function (token) { return searchable.indexOf(token) !== -1; })) return null;
      var score = filters.tokens.reduce(function (total, token) {
        return total + (title.includes(token) ? 12 : 0) + (tags.includes(token) ? 7 : 0) +
          (summary.includes(token) ? 4 : 0) + (sections.includes(token) ? 1 : 0);
      }, 0);
      if (phrase && title.includes(phrase)) score += 20;
      if (phrase && title === phrase) score += 30;
      return { article: article, score: score, index: index };
    }).filter(Boolean);

    ranked.sort(function (a, b) {
      var difference = 0;
      if (filters.sort === 'title') difference = text(a.article.title).localeCompare(text(b.article.title));
      else if (filters.sort === 'popular') difference = (Number(b.article.views) || 0) - (Number(a.article.views) || 0);
      else if (filters.sort === 'updated' || filters.sort === 'newest') {
        difference = timestamp(b.article.updated) - timestamp(a.article.updated);
      } else difference = b.score - a.score;
      return difference || a.index - b.index;
    });
    return ranked.map(function (entry) { return entry.article; });
  }

  function quoteCQL(value) {
    return '"' + value.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
  }

  function literalLuceneTerm(value) {
    // Each token is a Lucene phrase. Escape Lucene first, then the enclosing
    // CQL string, so operators, wildcards and quotes remain search text.
    return '"' + value.replace(/[+\-&|!(){}\[\]^"~*?:\\/]/g, '\\$&') + '"';
  }

  function pageID(value) {
    if (typeof value === 'number' && !Number.isSafeInteger(value)) throw new TypeError('Invalid root page ID.');
    if (!/^[1-9]\d{0,19}$/.test(String(value == null ? '' : value))) {
      throw new TypeError('Set a valid wcspedia root page ID before connecting Confluence search.');
    }
    return String(value);
  }

  function buildCQL(options, config) {
    config = config || {};
    var id = pageID(config.rootPageId); // Fail closed: never fall back to a whole-space search.
    var filters = optionsFor(options);
    if (config.directChildren != null && typeof config.directChildren !== 'boolean') {
      throw new TypeError('directChildren must be a boolean.');
    }
    var clauses = ['type = page', (config.directChildren ? 'parent' : 'ancestor') + ' = ' + id];
    if (config.spaceKey != null) {
      if (typeof config.spaceKey !== 'string' || !/^[A-Za-z0-9~][A-Za-z0-9_.~\-]{0,254}$/.test(config.spaceKey)) {
        throw new TypeError('Invalid Confluence space key.');
      }
      clauses.push('space = ' + quoteCQL(config.spaceKey));
    }
    if (filters.tokens.length) {
      clauses.push('(' + filters.tokens.map(function (token) {
        return 'text ~ ' + quoteCQL(literalLuceneTerm(token));
      }).join(' AND ') + ')');
    }
    if (filters.categories.length) clauses.push('label IN (' + filters.categories.map(function (category) {
      return quoteCQL('wcs-topic-' + category);
    }).join(', ') + ')');
    if (filters.types.length) clauses.push('label IN (' + filters.types.map(function (type) {
      return quoteCQL('wcs-type-' + type.toLowerCase());
    }).join(', ') + ')');
    if (WINDOWS[filters.updated]) clauses.push('lastmodified >= startOfDay("-' + WINDOWS[filters.updated] + 'd")');
    var cql = clauses.join(' AND ');
    if (filters.sort === 'updated' || filters.sort === 'newest') cql += ' ORDER BY lastmodified DESC';
    if (filters.sort === 'title') cql += ' ORDER BY title ASC';
    if (filters.sort === 'popular') throw new TypeError('Popularity sorting is available in the local prototype only.');
    return cql;
  }

  function integerOption(value, fallback, min, max, name) {
    if (value == null) return fallback;
    if (!Number.isInteger(value) || value < min || value > max) throw new RangeError('Invalid ' + name + '.');
    return value;
  }

  function contextURL(config) {
    if (!root.location || !/^https?:$/.test(root.location.protocol)) {
      throw new Error('Live search must run inside Confluence over HTTP or HTTPS.');
    }
    var origin = root.location.origin;
    var base = new URL(config.baseUrl || '/', origin);
    if (base.origin !== origin || base.username || base.password || base.search || base.hash) {
      throw new TypeError('Confluence baseUrl must be a same-origin context path, without credentials, query or fragment.');
    }
    return new URL(base.pathname.replace(/\/+$/, '') + '/rest/api/search', origin);
  }

  function plainText(value) {
    // Confluence excerpts can contain highlight markup. Return text, never HTML.
    // Consumers should still use textContent / escapeHTML when displaying strings.
    return text(value).replace(/<(script|style)\b[^>]*>[\s\S]*?<\/\1>/gi, '')
      .replace(/<[^>]*>/g, '').replace(/@@@(?:end)?hl@@@/g, '')
      .replace(/&(amp|lt|gt|quot|apos|nbsp);|&#(\d+);|&#x([\da-f]+);/gi, function (match, named, decimal, hex) {
        if (named) return ({ amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ' })[named.toLowerCase()];
        var code = parseInt(decimal || hex, decimal ? 10 : 16);
        return code > 0 && code <= 0x10ffff && !(code >= 0xd800 && code <= 0xdfff) ? String.fromCodePoint(code) : '';
      }).replace(/\s+/g, ' ').trim();
  }

  function safeResultURL(value, endpoint, basePath) {
    if (!value) return null;
    try {
      // Search URLs are often relative to the Confluence context, e.g. /spaces/...
      var path = value;
      if (basePath && value.startsWith('/') && !value.startsWith('//') && !value.startsWith(basePath + '/')) path = basePath + value;
      var url = new URL(path, endpoint.origin + basePath + '/');
      if (url.origin !== endpoint.origin || url.username || url.password || !/^https?:$/.test(url.protocol)) return null;
      return url.href;
    } catch (_) { return null; }
  }

  function normalizeResult(result, endpoint, basePath) {
    var content = result.content || {};
    var labels = ((content.metadata || {}).labels || {}).results || [];
    var names = labels.map(function (label) { return text(label.name || label.label); });
    var category = names.find(function (name) { return /^wcs-topic-[a-z0-9-]+$/.test(name); });
    var kind = names.find(function (name) { return /^wcs-type-[a-z]+$/.test(name); });
    var type = TYPES.find(function (candidate) { return 'wcs-type-' + candidate.toLowerCase() === kind; }) || 'Reference';
    return {
      id: String(content.id || result.id || ''),
      title: plainText(result.title || content.title),
      summary: plainText(result.excerpt),
      category: category ? category.slice('wcs-topic-'.length) : '',
      type: type,
      updated: text(result.lastModified || (content.version || {}).when),
      tags: names.filter(function (name) { return !name.startsWith('wcs-topic-') && !name.startsWith('wcs-type-'); }),
      sections: [],
      views: null,
      readTime: null,
      url: safeResultURL(result.url || (content._links || {}).webui, endpoint, basePath)
    };
  }

  async function searchConfluence(options, config, request) {
    options = options || {};
    config = config || {};
    request = request || {};
    var cql = buildCQL(options, config);
    if (options.savedOnly) throw new TypeError('Saved article filtering is available in the local prototype only.');
    var endpoint = contextURL(config);
    var basePath = endpoint.pathname.slice(0, -'/rest/api/search'.length);
    var params = new URLSearchParams({
      cql: cql,
      limit: String(integerOption(options.limit, 20, 1, 100, 'result limit')),
      expand: 'content.metadata.labels,content.version',
      excerpt: 'highlight'
    });
    if (options.cursor != null) {
      if (typeof options.cursor !== 'string' || !options.cursor || options.cursor.length > 4096) throw new TypeError('Invalid search cursor.');
      params.set('cursor', options.cursor);
    } else params.set('start', String(integerOption(options.start, 0, 0, Number.MAX_SAFE_INTEGER, 'result offset')));
    endpoint.search = params.toString();
    var response = await root.fetch(endpoint.href, {
      method: 'GET', credentials: 'same-origin', mode: 'same-origin', redirect: 'error',
      headers: { Accept: 'application/json' }, signal: request.signal
    });
    if (!response.ok) {
      var error = new Error('Confluence search failed (' + response.status + ').');
      error.status = response.status;
      throw error;
    }
    var payload = await response.json();
    if (!payload || !Array.isArray(payload.results)) throw new Error('Confluence returned an unexpected search response.');
    var next = null;
    var nextLink = (payload._links || {}).next || payload.next;
    if (typeof nextLink === 'string') {
      var nextURL = safeResultURL(nextLink, endpoint, basePath);
      if (nextURL) {
        var continuation = new URL(nextURL);
        if (continuation.pathname === endpoint.pathname) {
          var cursor = continuation.searchParams.get('cursor');
          var start = continuation.searchParams.get('start');
          if (cursor && cursor.length <= 4096) next = { cursor: cursor };
          else if (/^\d+$/.test(start || '') && Number.isSafeInteger(Number(start))) next = { start: Number(start) };
        }
      }
    }
    var total = Number.isFinite(payload.totalSize) ? payload.totalSize : Number.isFinite(payload.total) ? payload.total : null;
    return { results: payload.results.map(function (result) { return normalizeResult(result, endpoint, basePath); }), total: total, next: next, cql: cql };
  }

  return Object.freeze({ filterArticles: filterArticles, buildCQL: buildCQL, searchConfluence: searchConfluence });
});

  function icon(name, cls='') { return `<svg class="${cls}" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">${paths[name] || paths.file}</svg>`; }
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function updateParam(key,value,resetPage=true) {const {params}=routeState(); if(value && value!=='any')params.set(key,value);else params.delete(key);if(resetPage)params.delete('page');go('#/results'+(params.size?'?'+params:''));}
  function saveButton(a) {const is=saved.includes(a.id);return `<button class="icon-button ${is?'is-saved':''}" data-action="save" data-id="${esc(a.id)}" aria-label="${is?'Unsave':'Save'} ${esc(a.title)}" aria-pressed="${is}">${icon('bookmark')}</button>`;}

  function home(){const list=search.filterArticles(articles,{sort:popularTab}).slice(0,3);return `<div class="fade-in"><section class="hero">${sampleNote()}${wordmark()}<h1>A world of knowledge.<br><span>One place to find it.</span></h1><p class="intro">Your everyday resource for Wealth Credit Services.<br>Explore guidance, understand our processes, and move forward with confidence.</p>${searchForm()}${trends()}<div class="hero-shortcuts"><a href="#/search">${icon('search')} Explore search</a><span class="divider"></span><a href="${resultsUrl()}">${icon('book')} All articles</a>${config.mode==='demo'?`<span class="divider"></span><a href="${resultsUrl('',{saved:true})}">${icon('bookmark')} Saved articles</a>`:''}</div></section><div class="container"><section class="section"><div class="section-heading"><div><h2>Find your starting point</h2><p>Knowledge organised around the work you do.</p></div><span class="eyebrow">6 knowledge areas</span></div><div class="category-grid">${categories.map(categoryCard).join('')}</div></section><section class="section popular-section"><div class="section-heading"><div><h2>A little knowledge goes a long way</h2><p>The essentials, the latest updates, and everything in between.</p></div><a class="text-link" href="${resultsUrl()}">Explore all articles ${icon('arrow')}</a></div><div class="section-tabs" aria-label="Featured articles"><button class="${popularTab==='popular'?'active':''}" data-action="tab" data-tab="popular" aria-pressed="${popularTab==='popular'}">Popular articles</button><button class="${popularTab==='updated'?'active':''}" data-action="tab" data-tab="updated" aria-pressed="${popularTab==='updated'}">Recently updated</button></div><div class="article-grid" id="wcs-popular">${list.map(articleCard).join('')}</div></section><aside class="getting-started"><div class="category-icon">${icon('compass')}</div><div><h3>New to Wealth Credit Services?</h3><p>Get your bearings with the people, processes, and tools behind our work.</p></div><a href="#/topic/learning" class="text-link">Start your learning journey ${icon('arrow')}</a></aside></div></div>`;}
  function searchLanding(){const qs=recent.length?recent.slice(0,4):['Securities-backed lending','Collateral','Annual credit review'];return `<div class="search-landing fade-in"><section class="hero">${sampleNote()}${wordmark()}<h1>What would you<br><span>like to know?</span></h1><p class="intro">Search across guides, procedures, policies, and practical know-how.</p>${searchForm('', 'Ask a question or search by keyword…')}${trends()}</section><div class="search-landing-body"><div class="discovery-columns"><section><h2>${recent.length?'Your recent searches':'Try a search'}</h2>${qs.map(q=>`<a class="sidebar-link" href="${resultsUrl(q)}">${icon(recent.length?'clock':'search')}${esc(q)}${icon('arrow')}</a>`).join('')}${recent.length?'<button class="text-link" style="margin-top:10px" data-action="clear-recent">Clear recent searches</button>':''}</section><section><h2>Browse by knowledge area</h2>${categories.slice(0,4).map(c=>`<a class="sidebar-link" href="${config.mode==='confluence'?resultsUrl('',{category:c.id}):'#/topic/'+c.id}">${icon(c.icon)}${esc(c.title)}${icon('arrow')}</a>`).join('')}</section></div><div class="search-guide">${icon('bulb')}<span>Start with a topic or a few keywords. Use filters on the results page to narrow your search.</span></div><div style="text-align:center;margin-top:26px"><a class="text-link" href="#/">${icon('left')} Back to the knowledge home</a></div></div></div>`;}
  function topicPage(id){const c=cat(id);if(!c)return missing();const list=articles.filter(a=>a.category===id);return `<div class="container subpage fade-in">${crumb([[c.title]])}<section class="topic-hero"><div><div class="eyebrow">Knowledge area</div><h1>${esc(c.title)}</h1><p>${esc(c.description)} Find practical guidance and shared knowledge to support your next step.</p><div class="topic-meta"><span>${list.length} articles</span><span>Curated by ${esc(list[0]?.owner||'Wealth Credit Services')}</span></div></div><div class="topic-illustration" aria-hidden="true">${icon(c.icon)}</div></section><div class="topic-main"><section><div class="section-heading"><div><h2>Explore ${esc(c.title.toLowerCase())}</h2><p>From the fundamentals to the finer details.</p></div><a class="text-link" href="${resultsUrl('',{category:id})}">Filter articles ${icon('filter')}</a></div>${list.map(a=>resultCard(a)).join('')}</section><aside class="topic-side"><div class="sidebar-panel"><h2>Other knowledge areas</h2>${categories.filter(x=>x.id!==id).map(x=>`<a class="sidebar-link" href="#/topic/${x.id}">${icon(x.icon)}${esc(x.title)}${icon('arrow')}</a>`).join('')}</div><div class="sidebar-panel" style="background:#f5f8ff"><span class="category-icon">${icon('search')}</span><h2 style="margin-top:13px">Looking for something specific?</h2><p>Search the knowledge base to find an answer across all topics.</p><a class="text-link" href="#/search" style="margin-top:16px">Search WCSpedia ${icon('arrow')}</a></div></aside></div></div>`;}
  function facetCount(o){try{return search.filterArticles(articles,o).length;}catch{return 0;}}
  function filters(o){return `<div class="filter-title"><h2>${icon('filter')} Filter results</h2><button data-action="clear-filters">Reset</button></div><fieldset class="filter-group"><legend>Knowledge area</legend>${categories.map(c=>`<label class="check-label"><input type="checkbox" name="category" value="${c.id}" ${o.categories.includes(c.id)?'checked':''}><span>${esc(c.title)}</span>${config.mode==='demo'?`<span class="count">${facetCount({...o,categories:[c.id]})}</span>`:''}</label>`).join('')}</fieldset><fieldset class="filter-group"><legend>Content type</legend>${TYPES.map(t=>`<label class="check-label"><input type="checkbox" name="type" value="${t}" ${o.types.includes(t)?'checked':''}><span>${t}</span>${config.mode==='demo'?`<span class="count">${facetCount({...o,types:[t]})}</span>`:''}</label>`).join('')}</fieldset><fieldset class="filter-group"><legend>Last updated</legend><label class="sr-only" for="wcs-updated">Last updated</label><select id="wcs-updated" class="filter-select" name="updated">${[['any','Any time'],['week','Past week'],['month','Past month'],['quarter','Past 3 months']].map(([v,n])=>`<option value="${v}" ${o.updated===v?'selected':''}>${n}</option>`).join('')}</select></fieldset>${config.mode==='demo'?`<fieldset class="filter-group"><legend>Your collection</legend><label class="check-label"><input type="checkbox" name="saved" ${o.savedOnly?'checked':''}><span>Saved articles only</span></label></fieldset>`:''}<div class="filter-tip">${icon('bulb')}A broader search can help you discover related guidance across knowledge areas.</div>`;}
  function chips(o){return [...o.categories.map(v=>['category',v,categoryTitle(v)]),...o.types.map(v=>['type',v,v]),...(o.updated!=='any'?[['updated',o.updated,{week:'Past week',month:'Past month',quarter:'Past 3 months'}[o.updated]]]:[]),...(o.savedOnly?[['saved','true','Saved articles']]:[])].map(([key,v,label])=>`<button class="filter-chip" data-action="remove-filter" data-key="${key}" data-value="${v}" aria-label="Remove ${esc(label)} filter">${esc(label)} ${icon('close')}</button>`).join('');}
  function empty(o){return `<div class="empty-state">${icon(o.savedOnly?'bookmark':'search')}<h2>${o.savedOnly?'Your saved collection starts here':'No articles found'}</h2><p>${o.savedOnly?'Save an article with the bookmark icon to keep useful knowledge close at hand.':'Try a different keyword or remove a filter to explore more of WCSpedia.'}</p><a class="btn secondary" href="${resultsUrl()}">Browse all articles ${icon('arrow')}</a></div>`;}
  function resultsPage(p){const o=options(p);let list=[];let queryError='';try{if(config.mode==='demo')list=search.filterArticles(articles,o);}catch(error){queryError=error.message;}const total=list.length;const pages=Math.ceil(total/perPage);const page=Math.min(Math.max(1,parseInt(p.get('page'),10)||1),pages||1);const current=list.slice((page-1)*perPage,page*perPage);return `<div class="fade-in"><section class="results-header"><div class="container">${crumb([['Search','#/search'],[o.savedOnly?'Saved articles':'Results']])}<h1>${o.savedOnly?'Your saved knowledge':o.query?'A little closer to your answer.':'Explore the knowledge base.'}</h1>${searchForm(o.query)}</div></section><div class="container"><button class="btn secondary mobile-filter-button" data-action="mobile-filters" aria-expanded="${mobileFilters}">${icon('filter')} Filters</button><div class="results-layout"><aside class="results-sidebar ${mobileFilters?'is-open':''}" aria-label="Search filters">${filters(o)}</aside><section class="results-main" aria-label="Search results"><div class="results-toolbar"><p class="results-count" id="wcs-count" role="status">${config.mode==='demo'?`<strong>${total} ${total===1?'article':'articles'}</strong>${o.query?` for “${esc(o.query)}”`:' in your knowledge base'}`:'Searching Confluence…'}</p><label class="sort-control"><span>Sort by</span><select name="sort" aria-label="Sort search results">${[['relevance','Most relevant'],['updated','Recently updated'],['title','Title A–Z'],...(config.mode==='demo'?[['popular','Most read']]:[])].map(([v,label])=>`<option value="${v}" ${o.sort===v?'selected':''}>${label}</option>`).join('')}</select></label></div><div class="active-filters">${chips(o)}</div><div id="wcs-result-list">${queryError?`<div class="empty-state">${icon('search')}<h2>Let’s simplify your search</h2><p>${esc(queryError)}</p><a class="btn secondary" href="#/search">Start a new search</a></div>`:config.mode==='demo'?(current.length?current.map(a=>resultCard(a,o.query)).join(''):empty(o)):'<div class="empty-state" aria-busy="true">Loading knowledge articles…</div>'}</div><div id="wcs-pagination">${total>perPage?`<div class="pagination"><span>Showing ${(page-1)*perPage+1}–${Math.min(page*perPage,total)} of ${total}</span><div class="page-buttons"><button data-page="${page-1}" ${page===1?'disabled':''} aria-label="Previous page">${icon('left')}</button>${Array.from({length:pages},(_,i)=>`<button data-page="${i+1}" class="${page===i+1?'current':''}" ${page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('')}<button data-page="${page+1}" ${page===pages?'disabled':''} aria-label="Next page">${icon('chevron')}</button></div></div>`:''}</div></section></div></div></div>`;}
  async function remoteResults(p){const o=options(p);const signature=p.toString();if(signature!==remoteSignature){remoteHistory=[];remoteOptions={};remoteSignature=signature;}remoteAbort=new AbortController();const controller=remoteAbort;try{const response=await search.searchConfluence({...o,now:undefined,...remoteOptions,limit:perPage},config,{signal:controller.signal});if(controller.signal.aborted)return;remoteNext=response.next;root.querySelector('#wcs-count').innerHTML=`<strong>${response.total==null?response.results.length:response.total} articles</strong>${o.query?` for “${esc(o.query)}”`:''}`;root.querySelector('#wcs-result-list').innerHTML=response.results.length?response.results.map(a=>resultCard(a,o.query)).join(''):empty(o);root.querySelector('#wcs-pagination').innerHTML=`<div class="pagination"><span>Confluence search</span><div class="page-buttons"><button data-action="remote-prev" ${remoteHistory.length?'':'disabled'}>Previous</button><button data-action="remote-next" ${remoteNext?'':'disabled'}>Next</button></div></div>`;}catch(e){if(e.name==='AbortError')return;root.querySelector('#wcs-count').textContent='Search unavailable';root.querySelector('#wcs-result-list').innerHTML=`<div class="empty-state">${icon('search')}<h2>We couldn’t load these articles</h2><p>${esc(e.message)}</p><button class="btn secondary" data-action="retry">Try again</button></div>`;}}
  function articlePage(id){const a=articles.find(a=>a.id===id);if(!a)return missing();const related=articles.filter(b=>b.category===a.category&&b.id!==id).slice(0,3);const is=saved.includes(id);return `<div class="container subpage fade-in">${crumb([[categoryTitle(a.category),'#/topic/'+a.category],['Article']])}<div class="article-layout"><article><div class="article-heading"><span class="type-label">${esc(a.type)} · ${esc(categoryTitle(a.category))}</span><h1>${esc(a.title)}</h1><p class="article-summary">${esc(a.summary)}</p><div class="article-byline"><div class="owner-avatar">WCS</div><div><strong>${esc(a.owner)}</strong><small>Updated ${date(a.updated)}</small></div><span class="read-time">${icon('clock')} ${a.readTime} min read</span></div></div><div class="article-callout"><strong>At a glance</strong>${esc(a.sections[0]?.paragraphs?.[0] || a.summary)}</div>${a.sections.map(s=>`<section class="article-section" id="section-${esc(s.id)}"><h2>${esc(s.title)}</h2>${(s.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join('')}${s.bullets?.length?`<ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}</section>`).join('')}<div class="result-tags">${a.tags.map(t=>`<a href="${resultsUrl(t)}" class="tag">${esc(t)}</a>`).join('')}</div><div class="feedback"><span>Was this article helpful?</span><button data-action="feedback" data-id="${id}" data-vote="yes" class="${feedback[id]==='yes'?'selected':''}" aria-pressed="${feedback[id]==='yes'}">${icon('thumb')} Yes</button><button data-action="feedback" data-id="${id}" data-vote="no" class="${feedback[id]==='no'?'selected':''}" aria-pressed="${feedback[id]==='no'}">${icon('down')} Not quite</button><small>${feedback[id]?'Thanks — your feedback is saved in this prototype.':'Your feedback helps make shared knowledge better.'}</small></div></article><aside class="article-sidebar"><div class="sticky-panel"><div class="article-actions"><button class="btn secondary" data-action="save" data-id="${id}" aria-pressed="${is}">${icon('bookmark')} ${is?'Saved':'Save article'}</button><button class="btn secondary" data-action="copy">${icon('link')} Copy link</button></div><nav class="toc" aria-label="On this page"><h2>On this page</h2>${a.sections.map(s=>`<a href="#section-${esc(s.id)}" data-section="${esc(s.id)}">${esc(s.title)}</a>`).join('')}</nav><div class="sidebar-panel"><h2>About this article</h2><div class="detail-row"><span>Content type</span><strong>${esc(a.type)}</strong></div><div class="detail-row"><span>Knowledge area</span><strong>${esc(categoryTitle(a.category))}</strong></div><div class="detail-row"><span>Last updated</span><strong>${date(a.updated)}</strong></div><div class="detail-row"><span>Reading time</span><strong>${a.readTime} minutes</strong></div></div><div class="sidebar-panel" style="background:#f8faff"><h2>Continue exploring</h2><div class="related-list">${related.map(b=>`<a href="${articleUrl(b)}">${esc(b.title)}<small>${b.type} · ${b.readTime} min read</small></a>`).join('')}</div></div><p class="article-disclaimer">Illustrative content for design review. This prototype does not establish credit policy or replace approved procedures.</p></div></aside></div></div>`;}
  function missing(){return `<div class="container subpage">${crumb([['Page not found']])}<div class="empty-state">${icon('file')}<h2>This page isn’t in the knowledge base</h2><p>Head back to WCSpedia or use search to find what you need.</p><a class="btn" href="#/">Back to home</a></div></div>`;}
  function render({keepScroll=false}={}){const scroll=window.scrollY;const active=document.activeElement;const focusFilter=root.contains(active)&&['category','type','updated','sort','saved'].includes(active.name)?{name:active.name,value:active.value}:null;remoteAbort?.abort();const {path,params}=routeState();if(config.mode==='confluence'&&path.startsWith('/topic/')){go(resultsUrl('',{category:path.slice(7)}));return;}let html;let title;if(path==='/'){html=home();title='Knowledge home';}else if(path==='/search'){html=searchLanding();title='Search';}else if(path==='/results'){html=resultsPage(params);title=options(params).query?'Search: '+options(params).query:'All articles';}else if(path.startsWith('/topic/')){html=topicPage(path.slice(7));title=categoryTitle(path.slice(7));}else if(path.startsWith('/article/')){html=articlePage(path.slice(9));title=articles.find(a=>a.id===path.slice(9))?.title||'Article';}else{html=missing();title='Page not found';}root.innerHTML=html;if(config.mode==='confluence'){root.querySelector('.popular-section')?.remove();root.querySelector('.getting-started')?.remove();}document.title=title+' · WCSpedia';if(focusFilter){Array.from(root.querySelectorAll('[name]')).find(el=>el.name===focusFilter.name&&el.value===focusFilter.value)?.focus({preventScroll:true});keepScroll=true;}if(!keepScroll)window.scrollTo({top:0,behavior:'instant'});else window.scrollTo({top:scroll,behavior:'instant'});if(path==='/results'&&config.mode==='confluence')remoteResults(params);}
  function toast(message){root.querySelector('.toast')?.remove();clearTimeout(toastTimer);const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.innerHTML=icon('check')+esc(message);root.append(el);toastTimer=setTimeout(()=>el.remove(),3000);}
  function remember(q){if(!q)return;recent=[q,...recent.filter(x=>x!==q)].slice(0,5);writeStorage('recent',recent);}
  function submitSearch(form){const input=form.querySelector('input');const q=input.value.trim();try{search.filterArticles([],{query:q});}catch(error){toast(error.message);input.focus();return;}remember(q);const state=routeState();const extra={};if(state.path==='/results'){for(const key of ['category','type','updated','sort','saved'])if(state.params.has(key))extra[key]=state.params.get(key);}go(resultsUrl(q,extra));}
  root.addEventListener('submit',e=>{if(e.target.matches('.search-form')){e.preventDefault();submitSearch(e.target);}});
  root.addEventListener('input',e=>{if(e.target.id!=='wcs-query')return;const q=e.target.value.trim();const box=root.querySelector('#wcs-suggestions');if(q.length<2||config.mode!=='demo'){box.hidden=true;e.target.setAttribute('aria-expanded','false');return;}let found;try{found=search.filterArticles(articles,{query:q}).slice(0,4);}catch(error){box.innerHTML='<div class="suggest-label">'+esc(error.message)+'</div>';box.hidden=false;e.target.setAttribute('aria-expanded','true');return;}box.innerHTML=`<div class="suggest-label">${found.length?'Suggested articles':'Search WCSpedia'}</div>${found.map(a=>`<a href="${articleUrl(a)}">${icon('file')}<span>${highlight(a.title,q)}</span><span class="suggestion-meta">${esc(a.type)}</span></a>`).join('')}<a href="${resultsUrl(q)}" data-search-term="${esc(q)}">${icon('search')}<span>See all results for “${esc(q)}”</span>${icon('arrow')}</a>`;box.hidden=false;e.target.setAttribute('aria-expanded','true');});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'){const box=root.querySelector('.suggestions');if(box)box.hidden=true;root.querySelector('#wcs-query')?.setAttribute('aria-expanded','false');}if(e.key==='ArrowDown'&&e.target.id==='wcs-query'){const link=root.querySelector('.suggestions:not([hidden]) a');if(link){e.preventDefault();link.focus();}}});
  document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const input=root.querySelector('#wcs-query');if(input)input.focus();else{go('#/search');setTimeout(()=>root.querySelector('#wcs-query')?.focus(),50);}}});
  document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap')){const box=root.querySelector('.suggestions');if(box)box.hidden=true;root.querySelector('#wcs-query')?.setAttribute('aria-expanded','false');}});
  root.addEventListener('change',e=>{const {name,value,checked}=e.target;if(name==='category'||name==='type'){const {params}=routeState();let values=(params.get(name)||'').split(',').filter(Boolean);values=checked?[...values,value]:values.filter(v=>v!==value);updateParam(name,values.join(','));}else if(name==='updated'||name==='sort'){updateParam(name,value);}else if(name==='saved'){updateParam('saved',checked?'true':'');}});
  root.addEventListener('click',async e=>{const target=e.target.closest('[data-action],[data-page],[data-section],[data-search-term]');if(!target)return;if(target.dataset.searchTerm)remember(target.dataset.searchTerm);if(target.dataset.section){e.preventDefault();document.getElementById('section-'+target.dataset.section)?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});return;}if(target.dataset.page){updateParam('page',target.dataset.page,false);return;}const {action,id}=target.dataset;if(action==='save'){const adding=!saved.includes(id);saved=adding?[...saved,id]:saved.filter(v=>v!==id);writeStorage('saved',saved);render({keepScroll:true});toast(adding?'Article saved to your collection':'Article removed from your collection');}else if(action==='tab'){popularTab=target.dataset.tab;root.querySelectorAll('[data-action="tab"]').forEach(b=>{const on=b.dataset.tab===popularTab;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});root.querySelector('#wcs-popular').innerHTML=search.filterArticles(articles,{sort:popularTab}).slice(0,3).map(articleCard).join('');}else if(action==='clear-filters'){const {params}=routeState();go(resultsUrl(params.get('q')||'',{sort:params.get('sort')||''}));}else if(action==='remove-filter'){const {key,value}=target.dataset;const {params}=routeState();const current=(params.get(key)||'').split(',').filter(v=>v!==value);updateParam(key,current.join(','));}else if(action==='mobile-filters'){mobileFilters=!mobileFilters;root.querySelector('.results-sidebar').classList.toggle('is-open',mobileFilters);target.setAttribute('aria-expanded',String(mobileFilters));}else if(action==='clear-recent'){recent=[];writeStorage('recent',recent);render({keepScroll:true});}else if(action==='feedback'){feedback[id]=target.dataset.vote;writeStorage('feedback',feedback);render({keepScroll:true});}else if(action==='copy'){try{await navigator.clipboard.writeText(location.href);toast('Article link copied');}catch{const field=document.createElement('textarea');field.value=location.href;field.style.position='fixed';field.style.opacity='0';document.body.append(field);field.select();const ok=document.execCommand('copy');field.remove();toast(ok?'Article link copied':'Copy the article URL from your browser');}}else if(action==='retry'){render({keepScroll:true});}else if(action==='remote-next'&&remoteNext){remoteHistory.push(remoteOptions);remoteOptions=remoteNext;render();}else if(action==='remote-prev'&&remoteHistory.length){remoteOptions=remoteHistory.pop();render();}});
  window.addEventListener('hashchange',()=>render());
  render();
})();

</script>
<noscript>This interactive prototype requires JavaScript.</noscript></body></html>
