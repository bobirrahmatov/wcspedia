          "title": "Writing a useful reporting handover",
          "summary": "Practical examples of the context that helps colleagues understand and reproduce reporting work.",
          "sections": [
            {
              "id": "context",
              "title": "Start with the context",
              "paragraphs": [
                "A useful handover explains the purpose of the report and the point in the reporting cycle."
              ],
              "bullets": [
                "Name the reporting period and audience.",
                "Link the source data and the working version."
              ]
            },
            {
              "id": "explain",
              "title": "Explain the observations",
              "paragraphs": [
                "Describe the finding before proposing a possible cause. A figure on its own can be difficult to interpret."
              ],
              "bullets": [
                "State the relevant comparison and its scope.",
                "Label working hypotheses that still need checking."
              ]
            },
            {
              "id": "next",
              "title": "Make the next action clear",
              "paragraphs": [
                "Give the receiving colleague enough information to continue without reconstructing the analysis."
              ],
              "bullets": [
                "List open questions and the person following up.",
                "Record the files, filters and steps needed to reproduce the result."
              ]
            }
          ],

    const actions=[...new Set(doc.audit.map(e=>e.action))];
    const value=v=>esc(typeof v==='object'?JSON.stringify(v,null,2):String(v==null?'—':v));
    return '<div class="panel-heading"><div><h2>Audit trail</h2><p>Who changed what, when, and why.</p></div><button class="button secondary" data-action="export">'+icon('download')+'Export audit</button></div><div class="audit-toolbar"><div><select aria-label="Filter audit by version" data-audit="auditVersion"><option value="">All versions</option>'+doc.versions.map(v=>'<option value="'+v.version+'" '+(version===String(v.version)?'selected':'')+'>Version '+v.version+'</option>').join('')+'</select> <select aria-label="Filter audit by action" data-audit="auditAction"><option value="">All actions</option>'+actions.map(a=>'<option value="'+esc(a)+'" '+(a===action?'selected':'')+'>'+esc(labels[a]||a)+'</option>').join('')+'</select></div><span class="eyebrow">'+events.length+' events</span></div><ol class="audit-list">'+events.map(e=>'<li class="audit-event"><span class="audit-icon">'+icon(e.toStatus==='Published'?'check':e.action==='edit'?'edit':'clock')+'</span><h3>'+esc(labels[e.action]||e.action)+'<time datetime="'+esc(e.at)+'">'+time(e.at)+'</time></h3><div class="audit-meta"><span>'+esc(person(e.actorId).name)+'</span><span>· v'+e.version+' / revision '+e.revision+'</span><span>· '+esc(e.fromStatus||'New')+' → '+esc(e.toStatus)+'</span></div><div class="audit-comment">'+esc(e.comment)+'</div><details><summary>Change details · '+e.changes.length+' fields</summary><p class="quiet-note">Event '+esc(e.id)+' · '+esc(e.at)+'</p><table class="change-table"><thead><tr><th>Field</th><th>Before</th><th>After</th></tr></thead><tbody>'+e.changes.map(c=>'<tr><td>'+esc(c.field)+'</td><td><pre>'+value(c.before)+'</pre></td><td><pre>'+value(c.after)+'</pre></td></tr>').join('')+'</tbody></table></details></li>').join('')+'</ol><p class="quiet-note">Times shown in Europe/Warsaw. Export includes UTC timestamps, every event, and all version snapshots. This local demo history requires a durable server audit store in production.</p>';
  }
  function render() {
    const r=route(); let content;
    if(r.path.startsWith('/document/')||r.path.startsWith('/article/'))content=documentPage();
    else if(r.path==='/search')content=searchLanding();
    else content=library();
    root.innerHTML=shell(content);
    document.title=(r.path.startsWith('/document/')?(selectedDocument().v?.title||'Document')+' · ':'')+'WCSpedia';
  }
  function toast(message) { const mount=root.querySelector('#toast-mount');if(!mount)return; clearTimeout(toastTimer);mount.innerHTML='<div class="toast">'+icon('check')+esc(message)+'</div>';toastTimer=setTimeout(()=>{mount.innerHTML='';},4200); }
  function persist() { try {localStorage.setItem(STORE,JSON.stringify({schema:2,documents}));memoryOnly=false;return true;}catch(_){memoryOnly=true;return false;} }
  function filterChange(key,value) {
    const r=route(), p=Object.fromEntries(r.params); if(r.path.startsWith('/topic/'))p.area=decodeURIComponent(r.path.split('/')[2]);
    p[key]=value;if(key!=='page')p.page=1;go(url('/results',p));
  }
  function field(id,label,value='',kind='input',attrs='') { return '<div class="form-group"><label for="'+id+'">'+label+'</label>'+(kind==='textarea'?'<textarea id="'+id+'" name="'+id+'" '+attrs+'>'+esc(value)+'</textarea>':'<input id="'+id+'" name="'+id+'" value="'+esc(value)+'" '+attrs+'>')+'</div>'; }
  function selection(id,label,options,value) {return '<div class="form-group"><label for="'+id+'">'+label+'</label><select id="'+id+'" name="'+id+'">'+options.map(o=>'<option value="'+esc(o.value)+'" '+(o.value===value?'selected':'')+'>'+esc(o.label)+'</option>').join('')+'</select></div>';}
  function openModal(action) {
    const state=selectedDocument(), doc=state.doc, v=doc?workflow.currentVersion(doc):null;
    if(action==='new'&&actor().role!=='Author')return;
    if(action!=='new'&&(!doc||!workflow.allowedActions(doc,actorId,data.people).includes(action)))return;
    savedFocus=document.activeElement;
    modal={action,docId:doc?.id,actorId,expectedVersion:v?.version,expectedRevision:v?.revision,expectedAuditLength:doc?.audit.length,sections:v?clone(v.sections):null};
    let fields='',title=action==='new'?'Create a document':actionLabels[action], description=action==='new'?'Start a draft. Review and manager approval come next.':v.title+' · v'+v.version+' / revision '+v.revision;
    if(action==='new'||action==='edit'){
      fields=field('doc-title','Document title',v?.title||'','input','required maxlength="160"')+field('doc-summary','Summary',v?.summary||'','textarea','required maxlength="1000"');
      if(action==='new')fields+='<div class="form-row">'+selection('doc-area','Business area',data.areas.map(a=>({value:a.id,label:a.title})),route().params.get('area')||data.areas[0].id)+selection('doc-type','Document type',types.map(t=>({value:t,label:t})),types[0])+'</div><div class="modal-summary"><strong>Owner & author:</strong> '+esc(actor().name)+'<br><strong>Reviewer:</strong> Jordan Lee · Manager<br><strong>Approver:</strong> Jordan Lee · Manager<br>The manager records review and approval separately.</div>'+field('doc-purpose','Purpose','','textarea','required')+field('doc-steps','Steps · one per line','','textarea','required')+field('doc-evidence','Evidence & checks · one per line','','textarea','required');
      else fields+=v.sections.map((s,i)=>field('section-title-'+i,'Section '+(i+1)+' title',s.title,'input','required')+field('section-text-'+i,'Section '+(i+1)+' text · blank line between paragraphs',s.paragraphs.join('\n\n'),'textarea')+field('section-bullets-'+i,'Section '+(i+1)+' steps · one per line',s.bullets.join('\n'),'textarea')).join('');
    } else {
      const desc={submit:'Send this revision to '+person(doc.reviewerId).name+' for content review. It will remain unavailable to readers until approved.','complete-review':'Confirm you have reviewed this exact revision. This records your review and moves it to manager approval.',approve:'Approve the reviewed revision and publish it now. Any previous approved version remains in the history.','request-changes':'Return this version to the author with clear feedback. It will need review again.',revise:'Create an editable draft from the approved content. The current approved version stays available to readers.'};
      fields='<div class="modal-summary">'+esc(desc[action])+'</div>';
      if(action==='approve') {const next=new Date();next.setMonth(next.getMonth()+6);const min=new Date();min.setDate(min.getDate()+1);fields+=field('next-review','Next review date',next.toISOString().slice(0,10),'input','type="date" required min="'+min.toISOString().slice(0,10)+'"');}
    }
    fields+=field('action-comment',action==='new'||action==='edit'||action==='revise'?'Change summary':'Decision comment','','textarea','required maxlength="2000" placeholder="Explain this change or decision for the audit trail."');
    root.querySelector('#modal-mount').innerHTML='<div class="modal-backdrop"><section class="modal '+(['new','edit'].includes(action)?'wide':'')+'" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-top"><div><h2 id="modal-title">'+esc(title)+'</h2><p>'+esc(description)+'</p></div><button class="icon-button" data-action="close" aria-label="Close dialog">'+icon('close')+'</button></div><form id="workflow-form"><div id="form-error" class="form-error" role="alert" hidden></div>'+fields+'<div class="modal-actions"><button type="button" class="button secondary" data-action="close">Cancel</button><button class="button" type="submit">'+esc(action==='new'?'Create draft':action==='edit'?'Save draft':title)+'</button></div></form></section></div>';
    root.querySelector('.shell').inert=true;root.querySelector('.modal input, .modal textarea, .modal select')?.focus();
  }
  function closeModal(){const refresh=modal?.reloadOnClose;modal=null;root.querySelector('.shell').inert=false;root.querySelector('#modal-mount').innerHTML='';if(refresh)render();else savedFocus?.focus();}
  function saveAction(form) {
    if(!modal||actorId!==modal.actorId)return;
    const f=new FormData(form), text=key=>String(f.get(key)||'').trim(), lines=key=>text(key).split('\n').map(s=>s.trim()).filter(Boolean), m=modal;
    try {
      readState(); const now=new Date().toISOString();let result;
      if(m.action==='new') {
        const id='doc-'+(typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now().toString(36)), reference='WCS-'+({'Job aid':'JA',Procedure:'PR','Knowledge sharing':'KS'}[text('doc-type')])+'-'+String(documents.length+1).padStart(3,'0');
        result=workflow.createDocument({id,reference,area:text('doc-area'),type:text('doc-type'),ownerId:actorId,authorId:actorId,reviewerId:'jordan',approverId:'jordan',title:text('doc-title'),summary:text('doc-summary'),changeSummary:text('action-comment'),sections:[{id:'purpose',title:'Purpose',paragraphs:[text('doc-purpose')],bullets:[]},{id:'steps',title:'Steps',paragraphs:[],bullets:lines('doc-steps')},{id:'evidence',title:'Evidence & checks',paragraphs:[],bullets:lines('doc-evidence')}]},{actorId,people:data.people,now});
        documents.push(result);
      } else {
        const index=documents.findIndex(d=>d.id===m.docId);if(index<0)throw Error('Document unavailable. Refresh and try again.');
        const options={actorId,people:data.people,now,comment:text('action-comment'),expectedVersion:m.expectedVersion,expectedRevision:m.expectedRevision,expectedAuditLength:m.expectedAuditLength};
        if(m.action==='edit')options.changes={title:text('doc-title'),summary:text('doc-summary'),sections:m.sections.map((s,i)=>({id:s.id,title:text('section-title-'+i),paragraphs:text('section-text-'+i).split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean),bullets:lines('section-bullets-'+i)}))};
        if(m.action==='approve'){options.effectiveAt=now;options.nextReviewAt=text('next-review');}
        result=workflow.transition(documents[index],m.action,options);documents[index]=result;
      }
      const persisted=persist();closeModal();const newRoute=docUrl(result.id,'approval',workflow.currentVersion(result).version);history.replaceState(null,'',newRoute);render();
      toast((m.action==='new'?'Draft created':labels[m.action])+(persisted?' · audit event recorded.':' · saved in memory only; browser storage unavailable.'));
    }catch(error){modal.reloadOnClose=true;const box=root.querySelector('#form-error');box.hidden=false;box.textContent=error.message;box.scrollIntoView({block:'nearest'});}
  }
  root.addEventListener('click',async event=>{
    const button=event.target.closest('[data-action]');
    if(button){const action=button.dataset.action;if(action==='close')return closeModal();if(action==='reset'){documents=clone(data.documents);memoryOnly=false;persist();actorId='alex';try{localStorage.setItem(ACTOR,actorId);}catch(_){}history.replaceState(null,'','#/');render();toast('Sample documents restored.');return;}
      if(action==='copy'){try{const selected=selectedDocument();await navigator.clipboard.writeText(location.href.split('#')[0]+docUrl(selected.doc.id,selected.tab,selected.v.version));toast('Document link copied.');}catch(_){toast('Copy the document URL from the address bar.');}return;}
      if(action==='export'){const {doc}=selectedDocument();if(!doc||!canManage(doc))return;const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),sample:true,document:doc},null,2)],{type:'application/json'});const objectUrl=URL.createObjectURL(blob),a=document.createElement('a');a.href=objectUrl;a.download=doc.reference+'-audit.json';a.click();setTimeout(()=>URL.revokeObjectURL(objectUrl),1000);toast('Full audit and version snapshots exported.');return;}
      openModal(action);return;
    }
    const page=event.target.closest('[data-page]');if(page)filterChange('page',page.dataset.page);
  });
  root.addEventListener('change',event=>{
    const target=event.target;
    if(target.id==='demo-actor'){actorId=target.value;try{localStorage.setItem(ACTOR,actorId);}catch(_){}modal=null;render();return;}
    if(target.dataset.filter)filterChange(target.dataset.filter,target.value);
    if(target.dataset.audit){const r=route(),p=Object.fromEntries(r.params);p[target.dataset.audit]=target.value;go(url(r.path,p));}
  });
  root.addEventListener('submit',event=>{event.preventDefault();const form=event.target;if(form.id==='workflow-form')return saveAction(form);if(form.dataset.search){const q=new FormData(form).get('q');if(form.dataset.search==='global')go(url('/results',{q}));else filterChange('q',q);}});
  document.addEventListener('keydown',event=>{
    if(modal){if(event.key==='Escape'){event.preventDefault();closeModal();}if(event.key==='Tab'){const nodes=[...root.querySelectorAll('.modal button:not([disabled]), .modal input, .modal textarea, .modal select, .modal a')],first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}return;}
    if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();const input=root.querySelector('.search-form input');if(input)input.focus();else go('#/search');}
  });
  window.addEventListener('hashchange',()=>{modal=null;render();window.scrollTo(0,0);});
  window.addEventListener('storage',event=>{if(event.key===STORE&&!modal){readState();render();}});
  render();
})();

</script>
