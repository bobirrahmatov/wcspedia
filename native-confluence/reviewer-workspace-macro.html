<!-- Approved HTML macro fragment, for Confluence Server/Data Center.
Replace REPLACE_WITH_ASSET_PAGE_ID with the shared asset page ID.
If these three assets already load globally, remove the repeated asset tags;
keep the mount element and script. Content remains in the native page body.
The shared configuration never supplies identity or grants permissions. -->
<link rel="stylesheet" href="/confluence/download/attachments/REPLACE_WITH_ASSET_PAGE_ID/wcspedia-style.css?api=v2">
<script src="/confluence/download/attachments/REPLACE_WITH_ASSET_PAGE_ID/native-confluence-config.js?api=v2"></script>
<script src="/confluence/download/attachments/REPLACE_WITH_ASSET_PAGE_ID/wcspedia-native.js?api=v2"></script>
<div id="wcspedia" class="wcs-native-host" aria-label="Reviewer workspace"><p>Loading reviewer workspace…</p></div>
<script>
(function () {
  'use strict';
  function mount() {
    var target = document.getElementById('wcspedia');
    if (!target) return;
    if (!window.WCSNativeApp || !window.WCS_NATIVE_CONFIG) {
      target.textContent = 'WCSpedia could not load. Please contact the page owner.';
      return;
    }
    Promise.resolve().then(function () { return window.WCSNativeApp.mount(target, Object.assign({}, window.WCS_NATIVE_CONFIG, { pageRole: 'review' })); }).catch(function () {
      target.textContent = 'WCSpedia could not load this view. Refresh the page or contact the page owner.';
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount, { once: true });
  else mount();
}());
</script>
